name: Scheduled update

on:
  schedule:
    - cron: '0 0,6,12,18 * * *' # Four times per day
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-scheduled
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup vendor
        run: make vendor

      - name: Restore Native Binary
        uses: actions/cache/restore@v4
        with:
          path: .bin
          key: planet-native-bin-${{ github.sha }}
          restore-keys: planet-native-bin-

      # planet's generator feeds the frontend build: it writes elm-app/src/Data.elm
      # and the OPML/search-index assets that Vite then bundles. It therefore runs
      # *before* the frontend build, unlike event-calendar and service-map where
      # the generator emits into dist/ afterwards.
      - name: Run Generator
        run: ./.bin/planet

      - name: Restore Elm cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elm
            elm-app/elm-stuff
          key: elm-${{ runner.os }}-${{ hashFiles('elm-app/elm.json') }}
          restore-keys: elm-${{ runner.os }}-

      - name: Build frontend
        uses: ./vendor/master-builder/.github/actions/build-frontend

      - name: Prepare Output
        run: make dist-assemble

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
