name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-tests:
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal-ci

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Nix + devenv
        uses: ./.github/workflows/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Elm cache
        id: elm-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elm
            elm-app/elm-stuff
          key: elm-${{ runner.os }}-${{ hashFiles('elm-app/elm.json') }}
          restore-keys: elm-${{ runner.os }}-
          
      - name: Update Cabal package index
        if: ${{ !inputs.skip-tests }}
        run: devenv shell --profile ci -- cabal update

      - name: Run Elm tests
        if: ${{ !inputs.skip-tests }}
        run: devenv shell --profile ci -- make check elm-test

      - name: Run Haskell tests
        if: ${{ !inputs.skip-tests }}
        run: devenv shell --profile ci -- cabal test

      - name: Build
        run: devenv shell --profile ci -- make dist-ci

      - name: Save Elm cache
        if: steps.elm-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elm
            elm-app/elm-stuff
          key: ${{ steps.elm-cache-restore.outputs.cache-primary-key }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    if: ${{ !inputs.skip-tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke-test.sh
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
